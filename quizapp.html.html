<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Greeting app</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .quiz-container {
        background: white;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 400px;
        

      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        background-color: #4caf50;
        color: white;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;

      }

      button:hover {
        background-color: #45a049;

      }

      .answer-button {
        display: block;
        margin: 10px auto;
        width: 100%;
        padding: 10px;
        background-color: #eee;
        border-radius: 5px;
        cursor: pointer;
}

    </style>
     
    
</head>
<body>


<div class="quiz-container">
  <h1>Simple Quiz App</h1>
  <div class="question-container">
    <p id="question">Loading...</p>
    <div id="answer-buttons">

    </div>
    <button id="next-button">Next</button>
  </div>
  <p id="score-display"  style="display: none;" ></p>
    <button id="restart-button" style="display: none">Restart Quiz</button>
    
</div>




</div>



  







<script src="counter.js"></script>
    
</body>
</html>
